<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم هفته</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ==========================================
           🎨 پالت رنگی یکپارچه و استاندارد راهینو
           ========================================== */
        :root { 
            --primary: #639889; --primary-hover: #4d7a6e; --primary-fade: rgba(99, 152, 137, 0.05);
            --accent: #d9858a; --accent-hover: #c4727c;
            --bg-color: #f7f9f8; --surface: #ffffff; --border-color: #e2e8f0;
            --text-main: #2d3748; --text-muted: #718096;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --pending: #718096; 
        }

        [data-theme="dark"] { 
            --primary: #77bba9; --primary-hover: #8fd0bf; --primary-fade: rgba(119, 187, 169, 0.1);
            --accent: #e59ea3; --bg-color: #121918; --surface: #1b2624; --border-color: #2d3d3a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --pending: #64748b; 
        }
        
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { background: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-bottom: 90px; }
        .app-container { max-width: 800px; margin: 0 auto; padding: 20px; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .theme-toggle { background: var(--surface); border: 1px solid var(--border-color); color: var(--text-main); width: 45px; height: 45px; border-radius: 14px; cursor: pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; }

        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .action-btn { background: var(--surface); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 14px; display: flex; justify-content: center; align-items: center; text-decoration: none; color: var(--text-main); font-size: 20px; }
        
        /* 🌟 استایل‌های جدید منوی کشویی هفته */
        .page-title { display: flex; flex-direction: column; align-items: center; }
        .page-title-text { font-size: 16px; font-weight: 900; color: var(--primary); }
        select.week-selector { background: var(--surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; border-radius: 8px; outline: none; font-size: 11px; margin-top: 5px; cursor: pointer; font-family: inherit; font-weight: bold;}

        .tabs-container { display: flex; background: var(--surface); border-radius: 16px; padding: 5px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; text-align: center; padding: 12px 2px; font-size: 13px; font-weight: bold; color: var(--text-muted); text-decoration: none; border-radius: 12px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-fade); color: var(--primary); border: 1px solid rgba(99, 152, 137, 0.3); }

        /* 🌟 استایل نوار پیشرفت هفتگی */
        .progress-box { background: var(--surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; margin-bottom: 20px; display: none; }
        .progress-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .progress-bar-bg { width: 100%; height: 8px; background: var(--bg-color); border-radius: 10px; overflow: hidden; display: flex; }
        .progress-bar-fill-success { height: 100%; background: var(--success); transition: width 1s ease; }
        .progress-bar-fill-danger { height: 100%; background: var(--danger); transition: width 1s ease; }

        /* تقویم گرافیکی Flex */
        .gcal-wrapper { overflow-x: auto; background: var(--surface); border-radius: 16px; border: 1px solid var(--border-color); direction: rtl; }
        .gcal-container { display: flex; min-width: 850px; background: var(--bg-color); position: relative; }
        .gcal-time-col { width: 50px; flex-shrink: 0; border-left: 1px solid var(--border-color); background: var(--surface); position: sticky; right: 0; z-index: 10; }
        .gcal-time-header { height: 45px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: var(--primary); }
        .gcal-time-slot { height: 60px; border-bottom: 1px dashed var(--border-color); font-size: 10px; color: var(--text-muted); text-align: center; padding-top: 5px; font-family: monospace; }
        .gcal-day-col { flex: 1; border-left: 1px solid var(--border-color); position: relative; min-width: 110px; }
        .gcal-day-header { height: 45px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; background: var(--surface); position: sticky; top: 0; z-index: 9; }
        .gcal-day-grid { position: relative; height: 1080px; background-image: linear-gradient(to bottom, transparent 59px, var(--border-color) 60px); background-size: 100% 60px; }
        
        .gcal-event { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 4px 6px; font-size: 10px; color: white; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border-right: 3px solid rgba(255,255,255,0.4); z-index: 5; display: flex; flex-direction: column; }
        .gcal-event.completed { border-right-color: rgba(255,255,255,0.5); }
        .gcal-event.shifted { opacity: 0.85; text-decoration: line-through; }
        .event-topic { font-size: 8px; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="nav-header">
            <a href="menu" class="action-btn">🔙</a>
            <div class="page-title" id="mainPageTitle">
                <div class="page-title-text">قطب‌نمای راهینو</div>
                <!-- 🌟 منوی آرشیو هفته‌ها -->
                <select id="weekSelector" class="week-selector" onchange="changeWeek()" style="display: none;"></select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="vip-setup" class="action-btn">⚙️</a>
            </div>
        </div>

        <div class="tabs-container">
            <a href="schedule" class="tab-btn">🎯 عملیات امروز</a>
            <a href="week" class="tab-btn active">🗓️ تقویم هفته</a>
            <a href="request" class="tab-btn">🎁 اتاق فکر</a>
        </div>

        <!-- 🌟 باکس پیشرفت هفتگی -->
        <div class="progress-box" id="weeklyProgressBox">
            <div class="progress-header">
                <span>پیشرفت این هفته</span>
                <div style="display:flex; gap:10px;">
                    <span id="successPercentText" style="color:var(--success);">0% انجام شده</span>
                    <span id="dangerPercentText" style="color:var(--danger);">0% عقب‌افتاده</span>
                </div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill-success" id="successBar" style="width: 0%;"></div>
                <div class="progress-bar-fill-danger" id="dangerBar" style="width: 0%;"></div>
            </div>
        </div>

        <div id="aiWeeklyMotivationBox" style="display: none; background: var(--primary-fade); border: 1px solid rgba(99, 152, 137, 0.3); border-radius: 16px; padding: 15px; margin-bottom: 20px; position: relative; animation: fadeIn 0.5s;">
            <button onclick="dismissWeeklyMotivation()" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.05); border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 10px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;">❌</button>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <span style="font-size: 20px;">🎯</span>
                <span style="font-size: 13px; font-weight: 900; color: var(--primary);">استراتژیِ این هفته:</span>
            </div>
            <p id="aiWeeklyMotivationText" style="font-size: 12px; color: var(--text-main); line-height: 1.8; margin-right: 28px; font-weight: 500;"></p>
        </div>

        <div class="gcal-wrapper">
            <div class="gcal-container" id="gcalGrid"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔒 لایه‌های امنیتی
        // ==========================================
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        };
        const SUPABASE_URL = 'https://etlutqwwqeahevsskjih.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bHV0cXd3cWVhaGV2c3NramloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTYwNjIsImV4cCI6MjA5NzE5MjA2Mn0.kXvSQtGM7w28IffQ4JOtv_xtHenyDV0tC70bOd7N7nQ'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
        
        const userId = localStorage.getItem('national_id') || localStorage.getItem('qotbnama_user_id') || localStorage.getItem('student_id') || localStorage.getItem('chat_id');

        if (!userId || userId === 'null' || userId === 'undefined') {
            alert("❌ سیستم نمی‌تواند هویت شما را تشخیص دهد. لطفاً مجدداً وارد شوید.");
            window.location.href = 'index';
        }
        
        let allSchedules = [];
        let currentScheduleObj = null;

        const themeBtn = document.getElementById('themeBtn');
        const currentTheme = localStorage.getItem('theme') || 'dark'; 
        if (currentTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeBtn.innerText = '☀️'; } else { themeBtn.innerText = '🌙'; }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeBtn.innerText = '🌙'; } 
            else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeBtn.innerText = '☀️'; }
        }

        window.onload = async function() { await fetchAndRender(); };

        function showEmptyState(msg) {
            const container = document.getElementById('gcalGrid');
            if (container) {
                container.innerHTML = `
                    <div style="padding: 60px 20px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <span style="font-size: 50px; margin-bottom: 15px; opacity: 0.5;">🗓️</span>
                        <h3 style="color: var(--text-muted); font-size: 14px;">${msg}</h3>
                    </div>`;
            }
            document.getElementById('weeklyProgressBox').style.display = 'none';
        }

        // ==========================================
        // 🚀 دریافت دیتای تمام هفته‌ها از سرور
        // ==========================================
        async function fetchAndRender() {
            try {
                const { data: schData, error: schErr } = await supabaseClient
                    .from('ai_schedules')
                    .select('*')
                    .eq('national_id', String(userId))
                    .eq('status', 'approved')
                    .order('target_start_date', { ascending: false });

                if (schErr || !schData || schData.length === 0) {
                    showEmptyState("هنوز هیچ برنامه‌ای برای شما ثبت نشده است.");
                    return;
                }

                allSchedules = schData;
                
                const selector = document.getElementById('weekSelector');
                selector.innerHTML = '';
                allSchedules.forEach(sch => {
                    let opt = document.createElement('option');
                    opt.value = sch.id;
                    opt.innerText = sch.week_label || 'برنامه ناشناس';
                    selector.appendChild(opt);
                });
                selector.style.display = 'block';

                let now = new Date();
                currentScheduleObj = allSchedules.find(s => {
                    let stDate = new Date(s.target_start_date);
                    stDate.setHours(0, 0, 0, 0); 
                    return stDate <= now;
                });
                
                if(!currentScheduleObj) currentScheduleObj = allSchedules[0]; 

                selector.value = currentScheduleObj.id;
                
                updateWeeklyProgress();
                renderGCal();

            } catch (err) {
                console.error("خطا در بارگذاری برنامه:", err);
                showEmptyState("خطا در دریافت اطلاعات از سرور.");
            }
        }

        function changeWeek() {
            const selectedId = document.getElementById('weekSelector').value;
            currentScheduleObj = allSchedules.find(s => s.id === selectedId);
            updateWeeklyProgress();
            renderGCal();
        }

        function updateWeeklyProgress() {
            const progressBox = document.getElementById('weeklyProgressBox');
            if(!currentScheduleObj || !currentScheduleObj.raw_plan) {
                progressBox.style.display = 'none';
                return;
            }

            let planArr = typeof currentScheduleObj.raw_plan === 'string' ? JSON.parse(currentScheduleObj.raw_plan) : currentScheduleObj.raw_plan;
            
            let taskBlocks = planArr.filter(p => 
                p.type !== 'break' && 
                p.subject !== 'بانک جبرانی' && 
                !p.subject.includes('ناهار') && 
                !p.subject.includes('شام') && 
                (p.type !== 'class' || p.topic === 'کلاس آنلاین') && 
                p.day !== 'bench' 
            );
            
            let total = taskBlocks.length;
            let completed = taskBlocks.filter(p => p.status === 'completed').length;
            let shifted = taskBlocks.filter(p => p.status === 'shifted').length;
            
            let compPercent = total > 0 ? Math.round((completed / total) * 100) : 0;
            let shiftPercent = total > 0 ? Math.round((shifted / total) * 100) : 0;

            document.getElementById('successPercentText').innerText = `${compPercent}% انجام شده`;
            document.getElementById('dangerPercentText').innerText = `${shiftPercent}% عقب‌افتاده`;
            
            document.getElementById('successBar').style.width = `${compPercent}%`;
            document.getElementById('dangerBar').style.width = `${shiftPercent}%`;

            progressBox.style.display = 'block';
        }

        // ==========================================
        // 📅 موتور رندر تقویم
        // ==========================================
        function renderGCal() {
            const weeklyMotivationBox = document.getElementById('aiWeeklyMotivationBox');
            const weeklyMotivationText = document.getElementById('aiWeeklyMotivationText');
            if (currentScheduleObj && currentScheduleObj.ai_motivations) {
                let aiMotivations = typeof currentScheduleObj.ai_motivations === 'string' ? JSON.parse(currentScheduleObj.ai_motivations) : currentScheduleObj.ai_motivations;
                let weeklyMessage = aiMotivations.weekly_motivation;
                if (weeklyMessage) {
                    let dismissedMsg = localStorage.getItem(`dismissed_weekly_${userId}_${currentScheduleObj.id}`);
                    if (dismissedMsg === weeklyMessage) { weeklyMotivationBox.style.display = 'none'; } 
                    else { weeklyMotivationText.innerText = weeklyMessage; weeklyMotivationBox.style.display = 'block'; }
                } else { weeklyMotivationBox.style.display = 'none'; }
            } else { weeklyMotivationBox.style.display = 'none'; }
            
            const container = document.getElementById('gcalGrid'); 
            container.innerHTML = '';
            const daysArr = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
            
            let timeColHtml = `<div class="gcal-time-col"><div class="gcal-time-header">ساعت</div>`;
            for(let i=6; i<=23; i++) { timeColHtml += `<div class="gcal-time-slot">${i.toString().padStart(2,'0')}:00</div>`; }
            container.innerHTML += timeColHtml + `</div>`;

            const planArr = typeof currentScheduleObj.raw_plan === 'string' ? JSON.parse(currentScheduleObj.raw_plan) : currentScheduleObj.raw_plan;

            daysArr.forEach((day) => {
                let dayBlocks = planArr.filter(p => p.day === day);
                
                let dayHtml = `<div class="gcal-day-col">
                                <div class="gcal-day-header">${day}</div>
                                <div class="gcal-day-grid">`;
                
                dayBlocks.forEach(part => {
                    if(!part.start_time || !part.end_time) return;

                    let startMins = (parseInt(part.start_time.split(':')[0])*60) + parseInt(part.start_time.split(':')[1]);
                    let endMins = (parseInt(part.end_time.split(':')[0])*60) + parseInt(part.end_time.split(':')[1]);
                    let topPx = Math.max(0, startMins - 360); 
                    let heightPx = endMins - startMins;

                    let bgColor = "var(--pending)"; 
                    if (part.type === 'class') bgColor = "#334155"; 
                    else if (part.subject.includes("ناهار") || part.subject.includes("شام")) bgColor = "#475569";
                    
                    if (part.status === 'completed') bgColor = "var(--success)"; 
                    else if (part.status === 'shifted') bgColor = "var(--danger)"; 
                    
                    let statusClass = part.status === 'completed' ? 'completed' : (part.status === 'shifted' ? 'shifted' : '');

                    let topicHtml = part.topic ? `<div class="event-topic">${part.topic}</div>` : '';

                    dayHtml += `<div class="gcal-event ${statusClass}" style="top: ${topPx}px; height: ${heightPx}px; background: ${bgColor};" title="${part.subject}\n${part.topic || ''}">
                                    <div style="font-weight:900;font-size:11px;">${part.subject}</div>
                                    ${topicHtml}
                                    <div style="font-size:9px;font-family:monospace; margin-top:auto;">${part.start_time}-${part.end_time}</div>
                                </div>`;
                });
                container.innerHTML += dayHtml + `</div></div>`;
            });
        }

        function dismissWeeklyMotivation() {
            const msgText = document.getElementById('aiWeeklyMotivationText').innerText;
            localStorage.setItem(`dismissed_weekly_${userId}_${currentScheduleObj.id}`, msgText);
            document.getElementById('aiWeeklyMotivationBox').style.display = 'none';
        }
    </script>
</body>
</html>
